name: Nix Build

# Builds MobilityNebula with MEOS enabled inside the flake's devShell and runs its test suite.
# libmeos is built from MobilityDB master with every family, inside the same devShell, so MEOS and
# MobilityNebula share one toolchain and one set of libraries.
# A pull request restores only the caches of its own ref and of main, so every push to main runs the
# build and saves the compiler and Nix caches that the next pull requests start from.
on:
  push:
    branches: [ main ]
  workflow_call:
    inputs:
      head_sha:
        type: string
        required: true
        description: "ref of the branch"
  workflow_dispatch:
    inputs:
      head_sha:
        type: string
        required: false
        description: "ref of the branch"

permissions:
  contents: read

jobs:
  nix-build:
    name: "Nix Build"
    timeout-minutes: 300
    runs-on: [ ubuntu-latest ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha || github.sha }}
          fetch-depth: 0
          submodules: recursive

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-nix-${{ inputs.head_sha || github.sha }}
          restore-keys: ccache-nix-

      - name: Resolve MobilityDB master
        id: mobilitydb
        run: |
          ./.nix/nix-run.sh ccache --zero-stats
          sha=$(git ls-remote https://github.com/MobilityDB/MobilityDB.git refs/heads/master | cut -f1)
          echo "MobilityDB master $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The installed libmeos is a function of the MobilityDB commit and of the devShell that builds
      # it, so a run on the same MobilityDB master and the same flake reuses it unbuilt.
      - name: Restore libmeos
        id: meos-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/meos
          key: meos-${{ steps.mobilitydb.outputs.sha }}-${{ hashFiles('flake.nix', 'flake.lock') }}

      - name: Build libmeos from MobilityDB master via devShell
        if: steps.meos-cache.outputs.cache-hit != 'true'
        env:
          MOBILITYDB_SHA: ${{ steps.mobilitydb.outputs.sha }}
        run: |
          git init -q "$RUNNER_TEMP/mobilitydb"
          git -C "$RUNNER_TEMP/mobilitydb" fetch -q --depth 1 https://github.com/MobilityDB/MobilityDB.git "$MOBILITYDB_SHA"
          git -C "$RUNNER_TEMP/mobilitydb" checkout -q FETCH_HEAD
          ./.nix/nix-run.sh cmake -S "$RUNNER_TEMP/mobilitydb" -B "$RUNNER_TEMP/mobilitydb-build" -G Ninja \
            -DMEOS=ON -DALL=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/meos"
          ./.nix/nix-run.sh cmake --build "$RUNNER_TEMP/mobilitydb-build" -j"$(nproc)"
          ./.nix/nix-run.sh cmake --install "$RUNNER_TEMP/mobilitydb-build"

      - name: Configure via devShell
        run: |
          ./.nix/nix-cmake.sh -DCMAKE_BUILD_TYPE=Debug -G Ninja -S . -B cmake-build-nix \
            -DNES_ENABLE_MEOS=ON -DMEOS_ROOT="$RUNNER_TEMP/meos" | tee configure.log
          # The MEOS plugin is optional in CMake: without libmeos it is skipped and the build passes
          # without compiling a single MEOS source. Refuse that.
          if grep -q "Skipping optional plugin: MEOS" configure.log; then
            echo "::error::the MEOS plugin was skipped; libmeos was not found at $RUNNER_TEMP/meos"; exit 1
          fi

      - name: Build via devShell
        run: |
          ./.nix/nix-cmake.sh --build cmake-build-nix -j"$(nproc)" -- -k 0

      # The hits and misses of this run's libmeos and MobilityNebula builds, and the cache's size
      # against its limit.
      - name: Report the compiler cache
        if: ${{ !cancelled() }}
        run: ./.nix/nix-run.sh ccache --show-stats --verbose

      - name: Run the tests via devShell
        run: |
          source .github/.env/test-none.env
          read -ra extra_ctest_args <<< "${ADDITIONAL_CTEST_ARGS}"
          ./.nix/nix-run.sh ctest --test-dir cmake-build-nix --no-tests=error -j"$(nproc)" --output-on-failure --timeout 1200 "${extra_ctest_args[@]}"

      # Saved after a passing or a failing build, since a failing build is the one a developer reruns
      # and an implicit post-job save would skip it. A cancelled run holds a partial cache, and a
      # pull request restores its own newest cache before main's, so a cancelled run saves none.
      - name: Save the compiler cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-nix-${{ inputs.head_sha || github.sha }}

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: nix-build-logs
          path: |
            configure.log
            cmake-build-nix/CMakeFiles/CMakeOutput.log
            cmake-build-nix/CMakeFiles/CMakeError.log
          retention-days: 7
