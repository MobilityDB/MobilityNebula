name: NES PR CI

# Orchestrator for every pull request, on the structure of NebulaStream's current pr.yml: classify
# the diff once, run the code pipeline (pr_code.yml) unless only documentation changed, and report
# one required status, "Code CI Done". Every job runs on a GitHub-hosted runner.
on:
  pull_request:
    types: [ synchronize, opened, reopened ]
  merge_group:
    branches: [ main ]

# Cancel previous runs of the same PR. In merge_group runs github.head_ref is empty, so fall back to
# github.ref, the unique gh-readonly-queue ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-pr
  cancel-in-progress: true

jobs:
  # Classify the diff (see .github/ci/full-ci-skip-paths.txt): a documentation-only PR skips the
  # code pipeline.
  classify:
    runs-on: ubuntu-24.04
    outputs:
      hasCodeChanges: ${{ steps.classify.outputs.hasCodeChanges }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history so tj-actions can diff base_sha..sha; a shallow clone yields an empty diff.
          fetch-depth: 0
      - id: classify
        uses: ./.github/actions/classify-pr-changes
        with:
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          head-sha: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

  code:
    needs: [ classify ]
    if: ${{ needs.classify.outputs.hasCodeChanges == 'true' }}
    uses: ./.github/workflows/pr_code.yml

  # The one required status check. It always runs and reads the result of the jobs it gates.
  code-ci-done:
    name: Code CI Done
    needs: [ classify, code ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Gate
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          HAS_CODE: ${{ needs.classify.outputs.hasCodeChanges }}
          CODE_RESULT: ${{ needs.code.result }}
        run: |
          # Fail-safe order: a broken classify must FAIL the gate, not silently pass it.
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::classify did not succeed: $CLASSIFY_RESULT"; exit 1
          fi
          if [ "$HAS_CODE" != "true" ]; then
            echo "No code changes — code CI legitimately skipped; passing."; exit 0
          fi
          if [ "$CODE_RESULT" = "success" ]; then
            echo "Code CI succeeded."; exit 0
          fi
          echo "::error::Code CI did not succeed: $CODE_RESULT"; exit 1
